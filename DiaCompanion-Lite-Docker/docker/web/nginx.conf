# Docker DNS nội bộ; biến upstream giúp nginx khởi động được ngay cả khi backend
# chưa sẵn sàng (nếu viết proxy_pass tên cố định, nginx thoát ngay khi không phân giải được).
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Ảnh đáy mắt tối đa 10 MB (+ phần multipart).
    client_max_body_size 12m;

    # Chạy AI 3 model trên CPU có thể mất hàng chục giây.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location /api/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    location = /health {
        set $backend http://backend:8080;
        proxy_pass $backend;
    }

    # config.js đổi được sau build → không cache.
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # Tệp băm tên (Vite) cache lâu; index.html thì không.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
